name = "nsquaredzz-stats"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# One request a day at 00:05 IST (18:35 UTC) to forget yesterday's visitor hashes.
[triggers]
crons = ["35 18 * * *"]

[vars]
# Sites allowed to report visits and read the numbers, comma separated.
ALLOWED_ORIGINS = "https://nsquaredzz.github.io"

[[d1_databases]]
binding = "DB"
database_name = "nsquaredzz-stats"
# From `wrangler d1 create nsquaredzz-stats`. An identifier, not a secret.
database_id = "a17edde8-f8e0-4eeb-bef9-bec281528673"
migrations_dir = "migrations"

[observability]
enabled = true

# Secrets, set with `wrangler secret put`, never committed:
#   SALT         mixed into the visitor hash, so hashes cannot be reproduced from an IP address
#   ADMIN_TOKEN  required to read /stats
