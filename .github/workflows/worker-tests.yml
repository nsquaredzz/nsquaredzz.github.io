name: worker tests

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker-tests.yml"]
  pull_request:
    paths: ["worker/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
